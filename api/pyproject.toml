[project]
name = "navigator-api"
version = "0.1.0"
description = "FastAPI service that serves the engine"
requires-python = ">=3.12"
dependencies = [
    "navigator-contracts",
    "navigator-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
