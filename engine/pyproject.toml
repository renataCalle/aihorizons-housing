[project]
name = "navigator-engine"
version = "0.1.0"
description = "Pure-Python feasibility engine: SiteContext in, SiteAnalysis out"
requires-python = ">=3.12"
dependencies = ["navigator-contracts", "numpy>=2.0", "shapely>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navigator_engine"]
# Versioned config (rules tables, cost tables, fitted parameters) ships inside the package.
artifacts = ["src/navigator_engine/config/**"]
