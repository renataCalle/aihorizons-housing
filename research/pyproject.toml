[project]
name = "navigator-research"
version = "0.1.0"
description = "Research notebooks and prototypes (never a production dependency)"
requires-python = ">=3.12"
dependencies = ["navigator-contracts", "navigator-engine", "navigator-pipeline", "duckdb>=1.1", "geopandas>=1.0", "httpx>=0.27", "matplotlib>=3.9", "openpyxl>=3.1", "pandas>=2.2", "pyarrow>=18", "pyogrio>=0.10"]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4.3", "ipykernel>=6.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
